<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Media Organizer</title>
<style>
:root {
  --bg: #f6f7f9; --card: #ffffff; --text: #1b1f24; --muted: #5d6673; --line: #e2e5ea;
  --accent: #2457d6; --track: #e4e8ee; --ok: #1a7f4b; --bad: #b3261e;
  --c-d: #2457d6; --c-mega: #c2570c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14171c; --card: #1d2128; --text: #e7eaee; --muted: #9aa3b0; --line: #2d333c;
    --accent: #6c9bff; --track: #2d333c; --ok: #4cc38a; --bad: #ff8a80;
    --c-d: #6c9bff; --c-mega: #f0a35a;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
main { max-width: 960px; margin: 0 auto; padding: 24px 16px 48px; }
header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px 16px; }
h1 { font-size: 1.1rem; letter-spacing: .08em; text-transform: uppercase; margin: 0; }
h2 { font-size: .8rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 36px 0 12px; font-weight: 600; }
.status { color: var(--muted); font-size: .9rem; display: flex; flex-wrap: wrap; gap: 4px 16px; }
.status .warn { color: var(--bad); }
.status .pill { color: var(--accent); font-weight: 600; }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-top: 24px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px 20px; }
.card .label { color: var(--muted); font-size: .8rem; }
.card .value { font-size: 1.7rem; font-weight: 600; margin-top: 4px; font-variant-numeric: tabular-nums; }
.card .sub { color: var(--muted); font-size: .85rem; margin-top: 2px; }
.milestones { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 6px 16px; }
.milestones li { color: var(--muted); }
.milestones li.done { color: var(--text); }
.milestones .mark { display: inline-block; width: 1.4em; color: var(--muted); }
.milestones li.done .mark { color: var(--ok); }
.bars { display: grid; gap: 14px; }
.bar-row .head { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 0 12px; font-size: .9rem; }
.bar-row .head span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { height: 10px; background: var(--track); border-radius: 5px; overflow: hidden; margin-top: 4px; }
.bar > div { height: 100%; background: var(--accent); border-radius: 5px; }
.chart { padding: 12px; }
.chartbox { position: relative; width: 100%; height: 240px; }
.chartbox.tall { height: 320px; }
.chartbox canvas { max-width: 100%; }
.chart .empty { padding: 12px 8px; }
.work p { margin: 0 0 8px; }
.muted { color: var(--muted); }
h2 .hint { text-transform: none; letter-spacing: 0; font-weight: 400; }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
.tiles > *, .cols > div, .bars > * { min-width: 0; }
.cols h3 { font-size: .9rem; margin: 0 0 8px; }
.cols .chart { margin-bottom: 12px; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .88rem; }
th, td { padding: 6px 10px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
td.name { white-space: normal; word-break: break-all; min-width: 160px; }
th { color: var(--muted); font-weight: 600; font-size: .78rem; }
th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; }
details summary { cursor: pointer; color: var(--accent); margin-top: 8px; }
details ul { margin: 8px 0 0; padding-left: 18px; word-break: break-all; font-size: .88rem; }
.empty { color: var(--muted); padding: 8px 0; }
@media (max-width: 700px) {
  main { padding: 16px; }
  .tiles, .cols { grid-template-columns: minmax(0, 1fr); }
}
</style>
</head>
<body>
<main>
  <header>
    <h1>Media Organizer</h1>
    <div class="status" id="status"></div>
  </header>
  <div class="tiles" id="tiles"></div>
  <h2>Milestones</h2>
  <ul class="milestones" id="milestones"></ul>
  <h2>First pass</h2>
  <div class="bars" id="firstpass"></div>
  <h2>Storage freed, last 30 days</h2>
  <div class="card chart" id="chart-cum">
    <div class="chartbox"><canvas role="img" aria-label="Cumulative GB freed per day, last 30 days"></canvas></div>
    <div class="empty" hidden></div>
  </div>
  <h2>Freed per day</h2>
  <div class="card chart" id="chart-daily">
    <div class="chartbox"><canvas role="img" aria-label="GB freed per day, last 30 days"></canvas></div>
    <div class="empty" hidden></div>
  </div>
  <h2>Work</h2>
  <div class="work" id="work"></div>
  <h2>Biggest folders</h2>
  <div class="cols">
    <div>
      <h3>D: library</h3>
      <div class="card chart" id="chart-folders-d">
        <div class="chartbox tall"><canvas role="img" aria-label="Biggest D: folders in GB"></canvas></div>
        <div class="empty" hidden></div>
      </div>
      <div id="folders-d"></div>
    </div>
    <div>
      <h3>MEGA</h3>
      <div class="card chart" id="chart-folders-mega">
        <div class="chartbox tall"><canvas role="img" aria-label="Biggest MEGA folders in GB"></canvas></div>
        <div class="empty" hidden></div>
      </div>
      <div id="folders-mega"></div>
    </div>
  </div>
  <h2>Recent activity <span class="hint">(20 newest)</span></h2>
  <div class="scroll" id="recent"></div>
  <h2>Biggest gains <span class="hint">(last 6 hours, top 20)</span></h2>
  <div class="scroll" id="top-gain"></div>
  <h2>Problems</h2>
  <div id="problems"></div>
</main>
<script src="static/chart.umd.min.js"></script>
<script>
"use strict";
var GIB = 1024 * 1024 * 1024, MIB = 1024 * 1024;
var lostConnection = false, last = null, busy = false;

function el(tag, cls, text, kids) {
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined && text !== null) n.textContent = text;
  (kids || []).forEach(function (k) { n.appendChild(k); });
  return n;
}
function fill(id, kids) {
  var box = document.getElementById(id);
  while (box.firstChild) box.removeChild(box.firstChild);
  kids.forEach(function (k) { box.appendChild(k); });
}
function size(n) {
  n = n || 0;
  return n >= GIB ? (n / GIB).toFixed(1) + " GB" : (n / MIB).toFixed(1) + " MB";
}
function gb(n) { return (n / GIB).toFixed(1) + " GB"; }
function count(n) { return (n || 0).toLocaleString(); }
function when(ts) { return new Date(ts * 1000).toLocaleString(); }
function pct(a, b) { return b > 0 ? Math.min(100, Math.round(100 * a / b)) : 0; }
function bar(p) {
  var fillEl = el("div");
  fillEl.style.width = p + "%";
  return el("div", "bar", null, [fillEl]);
}
function empty(text) { return el("div", "empty", text); }

function renderStatus(s) {
  var parts = [el("span", null, s.mac_reachable ? "Mac: reachable" : "Mac: away")];
  if (s.paused) parts.push(el("span", "pill", "Paused"));
  if (lostConnection) parts.push(el("span", "warn", "Connection lost — retrying"));
  fill("status", parts);
}

function tile(label, value, sub) {
  var kids = [el("div", "label", label), el("div", "value", value)];
  if (sub) kids.push(el("div", "sub", sub));
  return el("div", "card", null, kids);
}
function renderTiles(s) {
  var d = s.disk, f = s.freed;
  fill("tiles", [
    tile("Storage freed", gb(f.total), "D: " + gb(f.d) + " · MEGA " + gb(f.mega)),
    tile("D: free", gb(d.d_free), "of " + gb(d.d_total)),
    tile("MEGA size now", gb(d.mega_bytes), "was " + gb(d.mega_bytes_start) + " at start")
  ]);
}

function renderMilestones(s) {
  fill("milestones", s.milestones.map(function (m) {
    return el("li", m.done ? "done" : "", null, [
      el("span", "mark", m.done ? "✔" : "○"), document.createTextNode(m.label)]);
  }));
}

function etaText(fp) {
  if (fp.total > 0 && fp.done >= fp.total) return "done";
  if (fp.eta_days === null || fp.eta_days === undefined) return "no estimate yet";
  if (fp.eta_days < 1) return "under a day left";
  return "about " + (fp.eta_days < 10 ? fp.eta_days.toFixed(1) : Math.round(fp.eta_days)) + " days left";
}
function renderFirstPass(s) {
  fill("firstpass", [["D: library", s.first_pass.d], ["MEGA", s.first_pass.mega]].map(function (r) {
    var fp = r[1];
    return el("div", "bar-row", null, [
      el("div", "head", null, [el("span", null, r[0]),
        el("span", null, count(fp.done) + " / " + count(fp.total) + " · " + etaText(fp))]),
      bar(pct(fp.done, fp.total))]);
  }));
}

var charts = {}; // created once, updated in place on every refresh
var DAY_SERIES = [["d", "D: library", "--c-d"], ["mega", "MEGA", "--c-mega"]];

function theme() {
  var cs = getComputedStyle(document.documentElement);
  function v(name) { return cs.getPropertyValue(name).trim(); }
  return {d: v("--c-d"), mega: v("--c-mega"), text: v("--muted"), grid: v("--line")};
}
function gbNum(n) { return (n || 0) / GIB; }
function gbLabel(v) { return Number(v).toFixed(1) + " GB"; }
function shorten(t) { t = String(t); return t.length > 26 ? t.slice(0, 25) + "\u2026" : t; }

function chartsMissing() { return typeof window.Chart !== "function"; }
function unavailable(id) {
  var card = document.getElementById(id);
  card.querySelector(".chartbox").hidden = true;
  var msg = card.querySelector(".empty");
  msg.textContent = "Charts unavailable";
  msg.hidden = false;
}

function axisStyle(t) {
  return {stacked: false, grid: {color: t.grid}, border: {color: t.grid}, ticks: {color: t.text}};
}
function baseOptions(t, extra) {
  var o = {
    responsive: true, maintainAspectRatio: false, animation: false,
    interaction: {mode: "index", intersect: false},
    plugins: {
      legend: {labels: {color: t.text, boxWidth: 14}},
      tooltip: {callbacks: {label: function (c) {
        var v = c.parsed[c.chart.options.indexAxis === "y" ? "x" : "y"];
        return (c.dataset.label ? c.dataset.label + ": " : "") + gbLabel(v);
      }}}
    },
    scales: {x: axisStyle(t), y: axisStyle(t)}
  };
  extra(o);
  return o;
}

function dayData(s, cumulative, t) {
  var days = s.daily;
  return {
    labels: days.map(function (d) { return d.date; }),
    datasets: DAY_SERIES.map(function (sr) {
      var run = 0, color = t[sr[0]];
      var data = days.map(function (d) { run += gbNum(d[sr[0]]); return cumulative ? run : gbNum(d[sr[0]]); });
      return cumulative
        ? {label: sr[1], data: data, borderColor: color, backgroundColor: color, borderWidth: 2,
           pointRadius: 2, tension: 0}
        : {label: sr[1], data: data, borderColor: color, backgroundColor: color, borderWidth: 0};
    })
  };
}
function folderData(list, key, t) {
  var top = list.slice().sort(function (a, b) { return b.bytes - a.bytes; }).slice(0, 10);
  return {
    labels: top.map(function (f) { return f.folder; }),
    datasets: [{label: "Size", data: top.map(function (f) { return gbNum(f.bytes); }),
                borderWidth: 0, backgroundColor: t[key], borderColor: t[key]}]
  };
}

var CHART_IDS = ["chart-cum", "chart-daily", "chart-folders-d", "chart-folders-mega"];
function gbTicks(o, axis) { o.scales[axis].ticks.callback = function (v) { return gbLabel(v); }; }
function dateTicks(o) { o.scales.x.ticks.maxTicksLimit = 6; o.scales.x.ticks.maxRotation = 0; }

function chartData(id, s, t) {
  if (id === "chart-cum") return dayData(s, true, t);
  if (id === "chart-daily") return dayData(s, false, t);
  return folderData(s.folders[id === "chart-folders-d" ? "d" : "mega"], id === "chart-folders-d" ? "d" : "mega", t);
}
function chartConfig(id, t, data) {
  if (id === "chart-cum") {
    return {type: "line", data: data, options: baseOptions(t, function (o) { gbTicks(o, "y"); dateTicks(o); })};
  }
  if (id === "chart-daily") {
    return {type: "bar", data: data, options: baseOptions(t, function (o) {
      gbTicks(o, "y"); dateTicks(o); o.scales.x.stacked = true; o.scales.y.stacked = true; })};
  }
  return {type: "bar", data: data, options: baseOptions(t, function (o) {
    o.indexAxis = "y"; o.plugins.legend.display = false; gbTicks(o, "x");
    o.scales.y.ticks.callback = function (v) { return shorten(this.getLabelForValue(v)); };
    o.plugins.tooltip.callbacks.title = function (items) { return items.length ? items[0].label : ""; };
  })};
}
function dropChart(id) {
  var c = charts[id];
  delete charts[id];
  try { if (c && c.destroy) c.destroy(); } catch (err) { /* already broken */ }
}
function noteNoData(s) {
  var none = s.daily.every(function (d) { return !d.d && !d.mega; });
  ["chart-cum", "chart-daily"].forEach(function (id) {
    var msg = document.getElementById(id).querySelector(".empty");
    msg.textContent = none ? "No conversions yet" : "";
    msg.hidden = !none;
  });
}

function renderCharts(s) {
  if (chartsMissing()) { CHART_IDS.forEach(unavailable); return; }
  var t = theme();
  CHART_IDS.forEach(function (id) {
    try {
      var data = chartData(id, s, t);
      if (!charts[id]) {
        charts[id] = new window.Chart(document.getElementById(id).querySelector("canvas"),
                                      chartConfig(id, t, data));
      } else {
        charts[id].data = data;
        charts[id].update("none");
      }
    } catch (err) {
      dropChart(id); // the next refresh builds it again
    }
  });
  noteNoData(s);
}

function applyTheme() {
  if (chartsMissing()) return;
  var t = theme();
  Object.keys(charts).forEach(function (id) {
    var c = charts[id], o = c.options;
    try {
    o.plugins.legend.labels.color = t.text;
    ["x", "y"].forEach(function (a) {
      o.scales[a].ticks.color = t.text; o.scales[a].grid.color = t.grid; o.scales[a].border.color = t.grid;
    });
    var keys = id.indexOf("folders-") >= 0 ? [id.slice(id.indexOf("folders-") + 8)] : ["d", "mega"];
    c.data.datasets.forEach(function (ds, i) {
      ds.borderColor = ds.backgroundColor = t[keys[i]];
    });
    c.update("none");
    } catch (err) { dropChart(id); }
  });
}
if (window.matchMedia) {
  var scheme = window.matchMedia("(prefers-color-scheme: dark)");
  if (scheme.addEventListener) scheme.addEventListener("change", applyTheme);
  else if (scheme.addListener) scheme.addListener(applyTheme);
}

function scanLine(sc) {
  if (!sc.finished) return sc.name + " never";
  return sc.name + " " + when(sc.finished) + (sc.ok ? " ok" : " " + (sc.message || "failed"));
}
function renderWork(s) {
  var kids = [], n = s.now, q = s.queue;
  if (n) {
    var p = typeof n.progress === "number" ? Math.round(n.progress * 100) : null;
    kids.push(el("p", null, "Now encoding " + (n.name || "?") + " (" + size(n.size) + ")" + (p === null ? "" : " " + p + "%")));
    if (p !== null) kids.push(bar(p));
  } else {
    kids.push(el("p", null, "Now: idle"));
  }
  var queue = "Queue: " + count(q.downloads) + " Downloads · " + count(q.intake) +
               " inbox · " + count(q.mega) + " MEGA · " + count(q.library) + " library";
  if (q.no_space) queue += " · " + count(q.no_space) + " waiting for space";
  if (q.evict_pending) queue += " · " + count(q.evict_pending) + " to release on the Mac";
  kids.push(el("p", "muted", queue));
  kids.push(el("p", "muted", "Last scans: " + s.scans.map(scanLine).join(" · ")));
  fill("work", kids);
}

function table(headers, rows) {
  var head = el("tr", null, null, headers.map(function (h) { return el("th", h[1] ? "num" : "", h[0]); }));
  var body = rows.map(function (r) {
    return el("tr", null, null, r.map(function (cell, i) {
      return el("td", headers[i][1] ? "num" : (headers[i][2] || ""), cell);
    }));
  });
  return el("div", "scroll", null, [el("table", null, null, [el("thead", null, null, [head]), el("tbody", null, null, body)])]);
}
function folderTable(list) {
  var kids = [];
  if (!list.length) kids.push(empty("No folders yet"));
  else kids.push(table([["Folder", false, "name"], ["Size", true], ["Files", true], ["Compressed", true]],
    list.map(function (f) { return [f.folder, size(f.bytes), count(f.files), pct(f.compressed_files, f.files) + "%"]; })));
  return el("div", null, null, kids);
}
function renderFolders(s) {
  fill("folders-d", [folderTable(s.folders.d)]);
  fill("folders-mega", [folderTable(s.folders.mega)]);
}

function conversionTable(id, rows, none) {
  if (!rows.length) { fill(id, [empty(none)]); return; }
  fill(id, [table([["Time"], ["File", false, "name"], ["Before → after", true], ["Saved", true]],
    rows.map(function (r) {
      var saved = r.bytes_before - r.bytes_after;
      var pct = r.bytes_before ? Math.round(saved * 100 / r.bytes_before) : 0;
      return [when(r.ts), r.relpath, size(r.bytes_before) + " → " + size(r.bytes_after),
              size(saved) + " (" + pct + "%)"];
    }))]);
}

function renderRecent(s) {
  conversionTable("recent", s.recent, "No conversions yet");
  conversionTable("top-gain", s.top_gain || [], "No conversions in the last 6 hours");
}

function renderProblems(s) {
  var p = s.problems;
  var kids = [el("p", null, count(p.error) + " errors · " + count(p["no-gain"]) + " no-gain · " +
                 count(p["low-quality"]) + " low-quality · " + count(p.changed) + " changed · " +
                 count(p["multi-frame"]) + " multi-frame" +
                 (p.stuck_published ? " · " + count(p.stuck_published) + " stuck (original not deleted)" : ""))];
  if (p.items.length) {
    kids.push(el("details", null, null, [
      el("summary", null, "Show " + p.items.length + " errors"),
      el("ul", null, null, p.items.map(function (it) {
        return el("li", null, it.location + " " + it.relpath + ": " + (it.error || it.reason || ""));
      }))]));
  }
  fill("problems", kids);
}

function render(s) {
  renderStatus(s); renderTiles(s); renderMilestones(s); renderFirstPass(s); renderCharts(s);
  renderWork(s); renderFolders(s); renderRecent(s); renderProblems(s);
}

function refresh() {
  if (busy) return;
  busy = true;
  var ctl = new AbortController();
  var timer = setTimeout(function () { ctl.abort(); }, 20000);
  fetch("/api/summary", {cache: "no-store", credentials: "same-origin", signal: ctl.signal})
    .then(function (r) { if (!r.ok) throw new Error("status " + r.status); return r.json(); })
    .then(function (s) { lostConnection = false; last = s; render(s); })
    .catch(function () {
      lostConnection = true;
      if (last) renderStatus(last);
      else fill("status", [el("span", "warn", "Connection lost \u2014 retrying")]);
    })
    .then(function () { clearTimeout(timer); busy = false; });
}
refresh();
setInterval(refresh, 30000);
</script>
</body>
</html>
